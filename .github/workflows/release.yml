# Builds Forge for Windows for download.
#
# Push a tag like v0.2.0 and this tests the code, builds x64 and ARM64, and attaches
# an installer and a portable zip of each to a draft GitHub release. Read the draft
# over and press Publish on the Releases page.
#
# Run it by hand (Actions > Release > Run workflow) to get the same files as a
# workflow artifact, without making a release.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x64
            rid: win-x64
            platform: x64
          - arch: arm64
            rid: win-arm64
            platform: ARM64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          # A tag v1.2.3 gives 1.2.3; a manual run gives a development version that can't be mistaken for a release.
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        if: matrix.arch == 'x64'
        run: dotnet test Forge.Core.Tests

      - name: Publish
        run: >
          dotnet publish Forge.App -c Release -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}
          -p:Version=${{ steps.version.outputs.version }} -o publish/${{ matrix.rid }} -nologo

      - name: Portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "dist/ForgeForWindows-${{ steps.version.outputs.version }}-${{ matrix.arch }}-portable.zip"

      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Could not install Inno Setup' }
          }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DArch=${{ matrix.arch }}" "/DSourceDir=$env:GITHUB_WORKSPACE\publish\${{ matrix.rid }}" tools\installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }

      - uses: actions/upload-artifact@v4
        with:
          name: ForgeForWindows-${{ steps.version.outputs.version }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Draft the release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          body: |
            ## Download

            Most people want the file ending in **x64-setup.exe**: run it, and Forge appears in the tray. No admin rights are needed; it installs for you only.

            - On a Windows on ARM PC (Surface Pro X, Snapdragon laptops), take the `arm64` setup instead.
            - The `portable.zip` files run without installing: unzip anywhere and start `ForgeForWindows.exe`.

            Windows may warn that the installer is from an unknown publisher, because it isn't code-signed. Choose **More info › Run anyway**.

            Updating: run the newer setup; your accounts, settings and tokens are kept.
